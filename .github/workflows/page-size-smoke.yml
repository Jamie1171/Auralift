name: Optimized app on 16 KB Android
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/page-size-smoke.yml'
      - 'scripts/release-page-smoke.py'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
permissions:
  contents: read
jobs:
  release16k:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build optimized public app
        run: ./gradlew :app:assemblePlayRelease
      - name: Sign isolated test copy
        run: |
          mkdir -p build/page-size-results
          keytool -genkeypair -keystore "$RUNNER_TEMP/auralift-page-test.jks" -storepass android -keypass android -alias page-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Isolated Auralift test'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/auralift-page-test.jks" --ks-pass pass:android --key-pass pass:android --out build/page-size-results/Auralift-optimized-page-test.apk app/build/outputs/apk/play/release/app-play-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/page-size-results/Auralift-optimized-page-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 build/page-size-results/Auralift-optimized-page-test.apk > build/page-size-results/zipalign.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check optimized startup and controls on a verified 16 KB runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 scripts/release-page-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auralift-optimized-16KB-evidence
          path: build/page-size-results/
          if-no-files-found: warn
