name: Android owner and public preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check all shipped translations and legal archives
        run: python3 scripts/check-localization.py
      - name: Check public-store builds reject test ads
        run: |
          mkdir -p build
          if ./gradlew -Pauralift.testAds=true -Pauralift.storeLive=true help > build/ad-config-guard.log 2>&1; then
            echo "Public-store build incorrectly accepted test ads"
            exit 1
          fi
          python3 -c 'from pathlib import Path; assert "Disable auralift.testAds and configure production AdMob IDs" in Path("build/ad-config-guard.log").read_text(); print("Public-store/test-ad conflict rejected as expected")'
      - name: Test, lint and package both editions
        run: >-
          ./gradlew :app:testOwnerDebugUnitTest :app:testPlayDebugUnitTest
          :app:lintOwnerDebug :app:lintPlayRelease :app:assembleOwnerDebug
          :app:assemblePlayRelease :app:bundlePlayRelease
      - name: Preserve current-OS test results
        run: cp -r app/build/test-results app/build/test-results-api35
      - name: Test oldest supported Android in a separate simulator JVM
        run: ./gradlew -Pauralift.testSdk=26 :app:testOwnerDebugUnitTest :app:testPlayDebugUnitTest
      - name: Retain Android signing tool for private local updates
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tool/
          if [ -f "$ANDROID_HOME/build-tools/35.0.0/NOTICE.txt" ]; then
            cp "$ANDROID_HOME/build-tools/35.0.0/NOTICE.txt" build/signing-tool/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auralift-owner-and-unsigned-public
          path: |
            app/build/outputs/apk/owner/debug/*.apk
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/reports/
            app/build/test-results/
            app/build/test-results-api35/
            app/build/screenshots/
            build/signing-tool/
            build/ad-config-guard.log
# Active at the root of Jamie1171/Auralift. CI debug keys are ephemeral; use the
# backed-up personal key for Owner updates. No production signing or cloud device
# lab is configured. Preserve available test reports even when verification fails.
