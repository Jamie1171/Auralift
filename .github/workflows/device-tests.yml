name: Android device tests and Firebase kit
on:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Screen-off duration on API 36
        type: choice
        default: '1200'
        options: ['30', '1200']
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  device:
    name: Device API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
          - api: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build matching public app and instrumentation APKs
        run: ./gradlew :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest
      - name: Package Firebase upload kit
        if: matrix.api == 26
        run: python3 scripts/package-firebase.py
      - uses: actions/upload-artifact@v4
        if: matrix.api == 26
        with:
          name: Auralift-Firebase-kit
          path: build/firebase-kit/
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute service, UI, permission and screen-off tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AURALIFT_SOAK_SECONDS: ${{ matrix.api == 36 && github.event_name == 'workflow_dispatch' && inputs.soak_seconds || '30' }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auralift-device-results-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            build/device-results/
          if-no-files-found: warn
